version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  web:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - LEETCODE_EMAIL=${LEETCODE_EMAIL}
      - LEETCODE_PASSWORD=${LEETCODE_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - SELENIUM_HEADLESS=true   # <-- force headless in container
    depends_on:
      - redis
    volumes:
      - cookies_data:/app   # persist cookies.pkl across restarts
    restart: unless-stopped

  worker:
    build: .
    command: celery -A celery_app worker --loglevel=info --pool=solo
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - LEETCODE_EMAIL=${LEETCODE_EMAIL}
      - LEETCODE_PASSWORD=${LEETCODE_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - SELENIUM_HEADLESS=true
    depends_on:
      - redis
    volumes:
      - cookies_data:/app
    restart: unless-stopped

  beat:
    build: .
    command: celery -A celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - LEETCODE_EMAIL=${LEETCODE_EMAIL}
      - LEETCODE_PASSWORD=${LEETCODE_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - SELENIUM_HEADLESS=true
    depends_on:
      - redis
    volumes:
      - cookies_data:/app
    restart: unless-stopped

volumes:
  redis_data:
  cookies_data: