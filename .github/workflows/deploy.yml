name: FleetCode CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Navigate to where your code lives on the VM (Update this if your folder name is different)
            cd ~/fleetcode-backend
            
            # Pull the fresh code you just pushed
            git pull origin main
            
            # Rebuild and restart the Docker containers to apply changes
            docker compose up -d --build